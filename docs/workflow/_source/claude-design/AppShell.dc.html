<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="ds-icons.js"></script>
<style>
  :root {
    --bg-app: oklch(0.982 0.002 265); --bg-surface: oklch(1 0 0); --bg-subtle: oklch(0.966 0.003 265); --bg-hover: oklch(0.952 0.004 265);
    --border: oklch(0.918 0.004 265);
    --text-1: oklch(0.245 0.012 265); --text-2: oklch(0.47 0.01 265); --text-3: oklch(0.63 0.008 265);
    --accent: oklch(0.52 0.09 264); --accent-hover: oklch(0.46 0.095 264); --accent-fg: oklch(0.99 0 0); --accent-subtle: oklch(0.955 0.022 264); --accent-text: oklch(0.5 0.1 264);
    --danger: oklch(0.57 0.16 25);
    --shadow-sm: 0 1px 2px oklch(0.2 0.02 265 / 0.06);
  }
  html[data-theme="dark"] {
    --bg-app: oklch(0.162 0.004 265); --bg-surface: oklch(0.205 0.005 265); --bg-subtle: oklch(0.242 0.006 265); --bg-hover: oklch(0.278 0.008 265);
    --border: oklch(0.29 0.007 265);
    --text-1: oklch(0.96 0.003 265); --text-2: oklch(0.72 0.008 265); --text-3: oklch(0.55 0.008 265);
    --accent: oklch(0.68 0.11 264); --accent-hover: oklch(0.74 0.11 264); --accent-fg: oklch(0.16 0.02 264); --accent-subtle: oklch(0.3 0.045 264); --accent-text: oklch(0.82 0.09 264);
    --danger: oklch(0.66 0.17 25);
    --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.3);
  }
  * { box-sizing: border-box; }
  [data-shell][data-collapsed="true"] [data-sb] { width: 76px; }
  [data-shell][data-collapsed="true"] [data-lbl] { opacity: 0; width: 0; overflow: hidden; }
  [data-shell][data-collapsed="true"] [data-wide] { display: none; }
  [data-shell][data-collapsed="true"] [data-navitem] { justify-content: center; }
  [data-shell] ::placeholder { color: var(--text-3); }
</style>
</helmet>
<div data-shell data-collapsed="{{ collapsed }}" style="display: flex; height: 100vh; overflow: hidden; background: var(--bg-app); color: var(--text-1); font-family: 'IBM Plex Sans KR', sans-serif; font-size: 14px; letter-spacing: -0.006em;">
  <aside data-sb style="flex-shrink: 0; width: 250px; background: var(--bg-surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: width .2s ease;">
    <div data-navitem style="height: 60px; flex-shrink: 0; display: flex; align-items: center; gap: 11px; padding: 0 18px; border-bottom: 1px solid var(--border);">
      <div style="width: 32px; height: 32px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: var(--accent-fg); flex-shrink: 0; box-shadow: var(--shadow-sm);"><ds-icon glyph="{{ brandGlyph }}" size="18"></ds-icon></div>
      <div data-lbl style="font-size: 16px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; transition: opacity .15s;">{{ brand }}</div>
    </div>
    <nav style="flex: 1; padding: 14px 12px; display: flex; flex-direction: column; gap: 3px; overflow-y: auto;">
      <sc-if value="{{ hasSection }}"><div data-wide style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); padding: 8px 10px 6px;">{{ section }}</div></sc-if>
      <sc-for list="{{ navView }}" as="item" hint-placeholder-count="4">
        <button data-navitem onClick="{{ item.onClick }}" title="{{ item.label }}" style="{{ item.style }}" style-hover="{{ item.hover }}">
          <span style="display: grid; place-items: center; flex-shrink: 0;"><ds-icon glyph="{{ item.glyph }}" size="18.5" sw="1.65"></ds-icon></span>
          <span data-lbl style="white-space: nowrap; transition: opacity .15s; flex: 1; text-align: left;">{{ item.label }}</span>
          <sc-if value="{{ item.hasBadge }}"><span data-lbl style="font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 20px; background: var(--accent-subtle); color: var(--accent-text);">{{ item.badge }}</span></sc-if>
        </button>
      </sc-for>
    </nav>
    <div style="padding: 12px; border-top: 1px solid var(--border);">
      <div data-navitem style="display: flex; align-items: center; gap: 11px; height: 42px; padding: 0 11px; border-radius: 9px;">
        <span style="width: 30px; height: 30px; border-radius: 50%; background: var(--accent-subtle); color: var(--accent-text); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex-shrink: 0;">{{ userInitial }}</span>
        <span data-lbl style="flex: 1; min-width: 0; white-space: nowrap;"><span style="display: block; font-size: 13px; font-weight: 600; line-height: 1.3;">{{ userName }}</span><span style="display: block; font-size: 11.5px; color: var(--text-3); line-height: 1.3;">{{ userRole }}</span></span>
      </div>
    </div>
  </aside>

  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
    <header style="height: 60px; flex-shrink: 0; background: color-mix(in oklab, var(--bg-app) 82%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; padding: 0 22px;">
      <button onClick="{{ onToggleCollapse }}" title="사이드바" style="width: 34px; height: 34px; border-radius: 8px; border: none; background: transparent; color: var(--text-2); cursor: pointer; display: grid; place-items: center; flex-shrink: 0;" style-hover="background: var(--bg-subtle);"><ds-icon glyph="panelLeft" size="18"></ds-icon></button>
      <div style="display: flex; align-items: center; gap: 8px; min-width: 0;">
        <span style="font-size: 13.5px; color: var(--text-3); white-space: nowrap;">{{ brand }}</span>
        <span style="color: var(--text-3); display: flex;"><ds-icon glyph="chevronRight" size="15"></ds-icon></span>
        <span style="font-size: 14px; font-weight: 600; white-space: nowrap;">{{ pageTitle }}</span>
      </div>
      <div style="flex: 1;"></div>
      <div style="position: relative; width: 240px; max-width: 30vw;">
        <span style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; display: flex;"><ds-icon glyph="search" size="16"></ds-icon></span>
        <input placeholder="{{ searchPlaceholder }}" onInput="{{ onSearch }}" style="width: 100%; height: 38px; padding: 0 12px 0 38px; border-radius: 9px; border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-1); font-size: 13.5px; font-family: inherit; outline: none;" style-focus="border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-subtle);">
      </div>
      <button onClick="{{ onToggleTheme }}" title="테마" style="width: 38px; height: 38px; border-radius: 9px; border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-2); cursor: pointer; display: grid; place-items: center; flex-shrink: 0;" style-hover="background: var(--bg-hover); color: var(--text-1);"><ds-icon glyph="{{ themeGlyph }}" size="18"></ds-icon></button>
      <button onClick="{{ onAction }}" style="height: 38px; padding: 0 15px; border-radius: 9px; border: none; background: var(--accent); color: var(--accent-fg); font-size: 13.5px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 7px; flex-shrink: 0; font-family: inherit; box-shadow: var(--shadow-sm);" style-hover="background: var(--accent-hover);"><ds-icon glyph="upload" size="17"></ds-icon>{{ actionLabel }}</button>
    </header>
    <main style="flex: 1; overflow-y: auto;">{{ children }}</main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1200, &quot;height&quot;: 720}, &quot;brand&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Frame&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;section&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;워크스페이스&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;items&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;object[]&quot;}, &quot;active&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;dashboard&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;collapsed&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;theme&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;light&quot;, &quot;dark&quot;], &quot;default&quot;: &quot;light&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;pageTitle&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;actionLabel&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;업로드&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;userName&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;김서연&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;userRole&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;관리자&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;children&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;ReactNode&quot;}}">
class Component extends DCLogic {
  state = { collapsed: null, active: null, theme: null };
  renderVals() {
    const p = this.props;
    const collapsed = this.state.collapsed == null ? (p.collapsed === true || p.collapsed === 'true') : this.state.collapsed;
    const theme = this.state.theme == null ? (p.theme ?? 'light') : this.state.theme;
    const items = p.items || [
      { id: 'dashboard', label: '개요', glyph: 'compass' },
      { id: 'library', label: '미디어 라이브러리', glyph: 'image', badge: '10' },
      { id: 'components', label: '컴포넌트', glyph: 'layers' },
      { id: 'settings', label: '설정', glyph: 'settings' },
    ];
    const controlled = p.active != null && !!p.onNavigate;
    const active = controlled ? p.active : (this.state.active == null ? (p.active ?? items[0].id) : this.state.active);
    const activeItem = items.find(i => (i.id || i.label) === active) || items[0];

    if (this.state.theme != null) { try { document.documentElement.dataset.theme = theme; } catch (e) {} }

    return {
      collapsed: collapsed ? 'true' : 'false',
      brand: p.brand ?? 'Frame',
      brandGlyph: p.brandGlyph ?? 'layers',
      hasSection: !!(p.section ?? '워크스페이스') && !collapsed,
      section: p.section ?? '워크스페이스',
      pageTitle: p.pageTitle ?? (activeItem ? activeItem.label : ''),
      searchPlaceholder: p.searchPlaceholder ?? '에셋, 태그, 컬렉션 검색…',
      actionLabel: p.actionLabel ?? '업로드',
      themeGlyph: theme === 'dark' ? 'sun' : 'moon',
      userInitial: (p.userName ?? '김서연').slice(0, 1),
      userName: p.userName ?? '김서연',
      userRole: p.userRole ?? '관리자',
      children: p.children,
      navView: items.map(it => {
        const key = it.id || it.label;
        const on = key === active;
        return {
          label: it.label, glyph: it.glyph || 'box',
          hasBadge: it.badge != null, badge: it.badge,
          style: `display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 11px; border-radius: 9px; border: none; cursor: pointer; font-size: 13.5px; font-family: inherit; font-weight: ${on ? 600 : 500}; background: ${on ? 'var(--accent-subtle)' : 'transparent'}; color: ${on ? 'var(--accent-text)' : 'var(--text-2)'}; transition: color .13s;`,
          hover: on ? 'background: var(--accent-subtle);' : 'background: var(--bg-subtle); color: var(--text-1);',
          onClick: () => { this.setState({ active: key }); if (p.onNavigate) p.onNavigate(key); },
        };
      }),
      onToggleCollapse: () => this.setState(s => ({ collapsed: !(s.collapsed == null ? (p.collapsed === true || p.collapsed === 'true') : s.collapsed) })),
      onToggleTheme: () => this.setState(s => { const cur = s.theme == null ? (p.theme ?? 'light') : s.theme; const next = cur === 'light' ? 'dark' : 'light'; if (p.onToggleTheme) p.onToggleTheme(next); return { theme: next }; }),
      onAction: p.onAction || (() => {}),
      onSearch: (e) => { if (p.onSearch) p.onSearch(e && e.target ? e.target.value : e); },
    };
  }
}
</script>
</body>
</html>

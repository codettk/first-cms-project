<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="ds-icons.js"></script>
<style>
  :root {
    --bg-surface: oklch(1 0 0); --border-strong: oklch(0.85 0.006 265);
    --text-1: oklch(0.245 0.012 265);
    --accent: oklch(0.52 0.09 264); --accent-fg: oklch(0.99 0 0);
  }
  html[data-theme="dark"] {
    --bg-surface: oklch(0.205 0.005 265); --border-strong: oklch(0.38 0.01 265);
    --text-1: oklch(0.96 0.003 265);
    --accent: oklch(0.68 0.11 264); --accent-fg: oklch(0.16 0.02 264);
  }
  * { box-sizing: border-box; }
</style>
</helmet>
<div style="display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; width: fit-content; font-family: 'IBM Plex Sans KR', sans-serif;" onClick="{{ onToggle }}">
  <sc-if value="{{ isRadio }}">
    <span style="{{ boxStyle }}"><sc-if value="{{ checked }}"><span style="position: absolute; inset: -1.5px; border-radius: 50%; border: 5.5px solid var(--accent);"></span></sc-if></span>
  </sc-if>
  <sc-if value="{{ isCheckbox }}">
    <span style="{{ boxStyle }}"><sc-if value="{{ checked }}"><span style="position: absolute; inset: -1.5px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; color: var(--accent-fg);"><ds-icon glyph="check" size="13" sw="2.4"></ds-icon></span></sc-if></span>
  </sc-if>
  <sc-if value="{{ hasLabel }}"><span style="font-size: 13.5px; color: var(--text-1);">{{ label }}</span></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 180, &quot;height&quot;: 48}, &quot;type&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;checkbox&quot;, &quot;radio&quot;], &quot;default&quot;: &quot;checkbox&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;checked&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;label&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;이미지&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  state = { on: null };
  get isOn() { return this.state.on == null ? (this.props.checked === true || this.props.checked === 'true') : this.state.on; }
  renderVals() {
    const p = this.props;
    const type = p.type ?? 'checkbox';
    const isRadio = type === 'radio';
    const checked = this.isOn;
    const radius = isRadio ? '50%' : '6px';
    return {
      label: p.label ?? '',
      hasLabel: !!(p.label),
      isRadio, isCheckbox: !isRadio, checked,
      boxStyle: `position: relative; width: 19px; height: 19px; border-radius: ${radius}; border: 1.5px solid var(--border-strong); flex-shrink: 0; background: var(--bg-surface);`,
      onToggle: () => {
        const next = !checked;
        this.setState({ on: next });
        if (this.props.onChange) this.props.onChange(next);
      },
    };
  }
}
</script>
</body>
</html>

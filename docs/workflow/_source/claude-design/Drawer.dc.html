<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="ds-icons.js"></script>
<style>
  :root {
    --bg-surface: oklch(1 0 0); --bg-subtle: oklch(0.966 0.003 265); --bg-hover: oklch(0.952 0.004 265);
    --border: oklch(0.918 0.004 265);
    --text-1: oklch(0.245 0.012 265); --text-2: oklch(0.47 0.01 265);
    --accent: oklch(0.52 0.09 264); --accent-hover: oklch(0.46 0.095 264); --accent-fg: oklch(0.99 0 0);
    --shadow-lg: 0 16px 48px oklch(0.2 0.02 265 / 0.18);
  }
  html[data-theme="dark"] {
    --bg-surface: oklch(0.205 0.005 265); --bg-subtle: oklch(0.242 0.006 265); --bg-hover: oklch(0.278 0.008 265);
    --border: oklch(0.29 0.007 265);
    --text-1: oklch(0.96 0.003 265); --text-2: oklch(0.72 0.008 265);
    --accent: oklch(0.68 0.11 264); --accent-hover: oklch(0.74 0.11 264); --accent-fg: oklch(0.16 0.02 264);
    --shadow-lg: 0 16px 48px oklch(0 0 0 / 0.6);
  }
  * { box-sizing: border-box; }
  @keyframes drwDim { from { opacity: 0; } to { opacity: 1; } }
  @keyframes drwSlide { from { transform: translateX(100%); } to { transform: none; } }
</style>
</helmet>
<sc-if value="{{ open }}">
  <div style="position: fixed; inset: 0; z-index: 60; font-family: 'IBM Plex Sans KR', sans-serif;">
    <div onClick="{{ onClose }}" style="position: absolute; inset: 0; background: oklch(0.15 0.02 265 / 0.4); animation: drwDim .2s ease;"></div>
    <div style="position: absolute; top: 0; right: 0; height: 100%; width: {{ width }}px; max-width: 92vw; background: var(--bg-surface); border-left: 1px solid var(--border); box-shadow: var(--shadow-lg); animation: drwSlide .26s cubic-bezier(0.32,0.72,0,1); display: flex; flex-direction: column;">
      <div style="height: 60px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid var(--border);">
        <div style="font-size: 16px; font-weight: 600; color: var(--text-1);">{{ title }}</div>
        <button onClick="{{ onClose }}" style="width: 32px; height: 32px; border-radius: 8px; border: none; background: transparent; color: var(--text-2); cursor: pointer; display: grid; place-items: center;" style-hover="background: var(--bg-subtle);"><ds-icon glyph="x" size="18"></ds-icon></button>
      </div>
      <div style="flex: 1; overflow-y: auto; padding: 20px;">{{ children }}</div>
      <sc-if value="{{ showFooter }}">
        <div style="flex-shrink: 0; padding: 16px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px;">
          <button onClick="{{ onClose }}" style="flex: 1; height: 42px; border-radius: 9px; border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-1); font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit;" style-hover="background: var(--bg-hover);">{{ cancelLabel }}</button>
          <button onClick="{{ onConfirm }}" style="flex: 1; height: 42px; border-radius: 9px; border: none; background: var(--accent); color: var(--accent-fg); font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;" style-hover="background: var(--accent-hover);">{{ confirmLabel }}</button>
        </div>
      </sc-if>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 460, &quot;height&quot;: 560}, &quot;open&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;title&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;새 미디어 업로드&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;width&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 400, &quot;min&quot;: 320, &quot;max&quot;: 640, &quot;tsType&quot;: &quot;number&quot;}, &quot;showFooter&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;confirmLabel&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;업로드 시작&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;cancelLabel&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;취소&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;children&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;ReactNode&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      open: p.open !== false && p.open !== 'false',
      width: Number(p.width ?? 400),
      title: p.title ?? '패널',
      children: p.children,
      showFooter: p.showFooter !== false && p.showFooter !== 'false',
      cancelLabel: p.cancelLabel ?? '취소',
      confirmLabel: p.confirmLabel ?? '확인',
      onClose: p.onClose || (() => {}),
      onConfirm: () => { if (p.onConfirm) p.onConfirm(); else if (p.onClose) p.onClose(); },
    };
  }
}
</script>
</body>
</html>

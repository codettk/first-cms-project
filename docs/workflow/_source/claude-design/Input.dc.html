<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="ds-icons.js"></script>
<style>
  :root {
    --bg-surface: oklch(1 0 0); --bg-subtle: oklch(0.966 0.003 265);
    --border: oklch(0.918 0.004 265); --border-strong: oklch(0.85 0.006 265);
    --text-1: oklch(0.245 0.012 265); --text-2: oklch(0.47 0.01 265); --text-3: oklch(0.63 0.008 265);
    --accent: oklch(0.52 0.09 264); --accent-subtle: oklch(0.955 0.022 264);
    --danger: oklch(0.57 0.16 25); --danger-bg: oklch(0.96 0.03 25); --danger-fg: oklch(0.51 0.16 25);
  }
  html[data-theme="dark"] {
    --bg-surface: oklch(0.205 0.005 265); --bg-subtle: oklch(0.242 0.006 265);
    --border: oklch(0.29 0.007 265); --border-strong: oklch(0.38 0.01 265);
    --text-1: oklch(0.96 0.003 265); --text-2: oklch(0.72 0.008 265); --text-3: oklch(0.55 0.008 265);
    --accent: oklch(0.68 0.11 264); --accent-subtle: oklch(0.3 0.045 264);
    --danger: oklch(0.66 0.17 25); --danger-bg: oklch(0.33 0.07 25); --danger-fg: oklch(0.84 0.13 25);
  }
  * { box-sizing: border-box; }
  [data-inp]::placeholder { color: var(--text-3); }
</style>
</helmet>
<label style="display: block; font-family: 'IBM Plex Sans KR', sans-serif;">
  <sc-if value="{{ showLabel }}"><span style="{{ labelStyle }}">{{ label }}<sc-if value="{{ required }}"><span style="color: var(--danger-fg);"> *</span></sc-if></span></sc-if>
  <div style="position: relative;">
    <sc-if value="{{ showGlyph }}"><span style="{{ iconWrapStyle }}"><ds-icon glyph="{{ glyph }}" size="16"></ds-icon></span></sc-if>
    <input data-inp value="{{ val }}" onInput="{{ onInput }}" placeholder="{{ placeholder }}" type="{{ type }}" disabled="{{ disabled }}" style="{{ inputStyle }}" style-focus="{{ focusStyle }}">
  </div>
  <sc-if value="{{ showError }}"><span style="{{ errorStyle }}">{{ error }}</span></sc-if>
</label>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 300, &quot;height&quot;: 90}, &quot;label&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;제목&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;value&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;placeholder&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;입력하세요…&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;glyph&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;type&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;text&quot;, &quot;email&quot;, &quot;password&quot;, &quot;number&quot;, &quot;url&quot;], &quot;default&quot;: &quot;text&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;error&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;required&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;disabled&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;size&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;sm&quot;, &quot;md&quot;, &quot;lg&quot;], &quot;default&quot;: &quot;md&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  state = { val: null };
  get value() { return this.state.val == null ? (this.props.value ?? '') : this.state.val; }
  renderVals() {
    const p = this.props;
    const label = p.label ?? '';
    const glyph = p.glyph ?? '';
    const type = p.type ?? 'text';
    const error = p.error ?? '';
    const required = !!p.required;
    const disabled = !!p.disabled;
    const size = p.size ?? 'md';
    const hasError = !!error;

    const H = size === 'sm' ? 38 : (size === 'lg' ? 46 : 42);
    const padLeft = glyph ? 38 : 14;
    const bd = hasError ? 'var(--danger)' : 'var(--border)';
    const shadow = hasError ? 'box-shadow: 0 0 0 3px var(--danger-bg);' : '';

    const inputStyle = `width: 100%; height: ${H}px; padding: 0 14px 0 ${padLeft}px; border-radius: 9px; border: 1px solid ${bd}; background: ${disabled ? 'var(--bg-subtle)' : 'var(--bg-surface)'}; color: ${disabled ? 'var(--text-3)' : 'var(--text-1)'}; font-size: 14px; font-family: inherit; outline: none; ${shadow}`;
    const focusStyle = hasError ? 'border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-bg);' : 'border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-subtle);';

    return {
      label, glyph, type, error, required, disabled,
      val: this.value,
      showLabel: !!label,
      showGlyph: !!glyph,
      showError: hasError,
      labelStyle: 'display: block; font-size: 13px; font-weight: 500; color: var(--text-2); margin-bottom: 8px;',
      iconWrapStyle: 'position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-3); display: flex;',
      inputStyle, focusStyle,
      errorStyle: 'display: block; font-size: 12px; color: var(--danger-fg); margin-top: 6px;',
      onInput: (e) => { this.setState({ val: e.target.value }); if (this.props.onChange) this.props.onChange(e.target.value); },
    };
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="ds-icons.js"></script>
<style>
  :root {
    --bg-subtle: oklch(0.966 0.003 265); --border: oklch(0.918 0.004 265);
    --text-1: oklch(0.245 0.012 265); --text-2: oklch(0.47 0.01 265); --text-3: oklch(0.63 0.008 265);
    --accent: oklch(0.52 0.09 264); --accent-subtle: oklch(0.955 0.022 264); --accent-text: oklch(0.5 0.1 264);
    --ok: oklch(0.62 0.09 155); --ok-bg: oklch(0.95 0.03 155); --ok-fg: oklch(0.44 0.08 155);
    --warn: oklch(0.72 0.1 75);
    --danger-fg: oklch(0.51 0.16 25);
  }
  html[data-theme="dark"] {
    --bg-subtle: oklch(0.242 0.006 265); --border: oklch(0.29 0.007 265);
    --text-1: oklch(0.96 0.003 265); --text-2: oklch(0.72 0.008 265); --text-3: oklch(0.55 0.008 265);
    --accent: oklch(0.68 0.11 264); --accent-subtle: oklch(0.3 0.045 264); --accent-text: oklch(0.82 0.09 264);
    --ok: oklch(0.7 0.12 155); --ok-bg: oklch(0.31 0.05 155); --ok-fg: oklch(0.84 0.1 155);
    --warn: oklch(0.8 0.12 82);
    --danger-fg: oklch(0.84 0.13 25);
  }
  * { box-sizing: border-box; }
</style>
</helmet>
<div style="display: grid; grid-template-columns: {{ labelCol }} 1fr; gap: 16px; align-items: start; padding: 13px 0; font-family: 'IBM Plex Sans KR', sans-serif;">
  <div style="display: flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--text-3); padding-top: 3px;">{{ label }}<sc-if value="{{ required }}"><span style="color: var(--danger-fg);">*</span></sc-if></div>
  <div style="min-width: 0;">
    <sc-if value="{{ empty }}"><span style="font-size: 13.5px; color: var(--text-3);">—</span></sc-if>

    <sc-if value="{{ dText }}"><div style="{{ textStyle }}">{{ valueText }}</div></sc-if>
    <sc-if value="{{ dBadge }}"><span style="display: inline-flex; align-items: center; height: 26px; padding: 0 11px; border-radius: 20px; background: var(--accent-subtle); color: var(--accent-text); font-size: 12.5px; font-weight: 500;">{{ valueText }}</span></sc-if>
    <sc-if value="{{ dChips }}"><div style="display: flex; flex-wrap: wrap; gap: 6px;"><sc-for list="{{ chips }}" as="c" hint-placeholder-count="3"><span style="display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 7px; background: var(--bg-subtle); border: 1px solid var(--border); font-size: 12.5px; color: var(--text-1);">{{ c }}</span></sc-for></div></sc-if>
    <sc-if value="{{ dUser }}"><span style="display: inline-flex; align-items: center; gap: 8px;"><span style="{{ userAv.style }}">{{ userAv.initial }}</span><span style="font-size: 13.5px; color: var(--text-1);">{{ userAv.name }}</span></span></sc-if>
    <sc-if value="{{ dUsers }}"><div style="display: flex; flex-wrap: wrap; gap: 8px;"><sc-for list="{{ userChips }}" as="u" hint-placeholder-count="2"><span style="display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 11px 0 4px; border-radius: 20px; background: var(--bg-subtle); border: 1px solid var(--border);"><span style="{{ u.style }}">{{ u.initial }}</span><span style="font-size: 12.5px; color: var(--text-1);">{{ u.name }}</span></span></sc-for></div></sc-if>
    <sc-if value="{{ dBool }}"><span style="display: inline-flex; align-items: center; height: 26px; padding: 0 11px; border-radius: 20px; font-size: 12.5px; font-weight: 600; {{ boolStyle }}">{{ boolText }}</span></sc-if>
    <sc-if value="{{ dLink }}"><span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--accent-text); font-family: 'IBM Plex Mono', monospace; cursor: pointer;">{{ valueText }} <span style="display: flex; opacity: 0.7;"><ds-icon glyph="externalLink" size="13"></ds-icon></span></span></sc-if>
    <sc-if value="{{ dRating }}"><div style="display: inline-flex; gap: 3px;"><sc-for list="{{ stars }}" as="s" hint-placeholder-count="5"><span style="{{ s.style }}"><ds-icon glyph="star" size="16" sw="1.5" fill="{{ s.fill }}"></ds-icon></span></sc-for></div></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 360, &quot;height&quot;: 60}, &quot;label&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;카테고리&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;type&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;text&quot;, &quot;textarea&quot;, &quot;number&quot;, &quot;date&quot;, &quot;daterange&quot;, &quot;select&quot;, &quot;multiselect&quot;, &quot;tags&quot;, &quot;user&quot;, &quot;multiuser&quot;, &quot;boolean&quot;, &quot;url&quot;, &quot;rating&quot;], &quot;default&quot;: &quot;select&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;value&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;브랜드&quot;, &quot;tsType&quot;: &quot;any&quot;}, &quot;required&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;labelCol&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;148px&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  hue(name) { let h = 0; for (let i = 0; i < (name || '').length; i++) h = (h * 31 + name.charCodeAt(i)) % 360; return h; }
  avatar(name, dim, fs) { const h = this.hue(name); return { name, initial: (name || '?').slice(0, 1), style: `display: inline-grid; place-items: center; width: ${dim}px; height: ${dim}px; border-radius: 50%; font-size: ${fs}px; font-weight: 700; flex-shrink: 0; background: oklch(0.93 0.035 ${h}); color: oklch(0.42 0.09 ${h});` }; }
  renderVals() {
    const p = this.props;
    const type = p.type ?? 'text';
    const v = p.value;
    const empty = v == null || v === '' || (Array.isArray(v) && v.length === 0);

    const disp = {
      text: 'text', textarea: 'text', number: 'text', date: 'text',
      daterange: 'text', select: 'badge', multiselect: 'chips', tags: 'chips',
      user: 'user', multiuser: 'users', boolean: 'boolean', url: 'link', rating: 'rating',
    }[type] || 'text';

    let valueText = '';
    if (!empty) {
      if (type === 'daterange' && Array.isArray(v)) valueText = `${v[0]}  →  ${v[1]}`;
      else if (!Array.isArray(v)) valueText = String(v);
    }

    const stars = [];
    if (disp === 'rating') {
      const val = empty ? 0 : Number(v);
      for (let i = 1; i <= 5; i++) {
        const on = i <= val;
        stars.push({ fill: on ? 'currentColor' : 'none', style: `display: inline-flex; color: ${on ? 'var(--warn)' : 'var(--border)'};` });
      }
    }

    return {
      label: p.label ?? '필드',
      required: !!p.required,
      labelCol: p.labelCol ?? '148px',
      empty: empty && disp !== 'boolean' && disp !== 'rating',
      dText: disp === 'text' && !empty,
      dBadge: disp === 'badge' && !empty,
      dChips: disp === 'chips' && !empty,
      dUser: disp === 'user' && !empty,
      dUsers: disp === 'users' && !empty,
      dBool: disp === 'boolean',
      dLink: disp === 'link' && !empty,
      dRating: disp === 'rating',
      valueText,
      textStyle: `font-size: 13.5px; color: var(--text-1); line-height: 1.55; ${type === 'daterange' ? "font-family: 'IBM Plex Mono', monospace;" : ''}`,
      chips: (disp === 'chips' && Array.isArray(v)) ? v : [],
      userAv: (disp === 'user' && !empty) ? this.avatar(String(v), 26, 11) : null,
      userChips: (disp === 'users' && Array.isArray(v)) ? v.map(n => this.avatar(String(n), 22, 10)) : [],
      boolStyle: v ? 'background: var(--ok-bg); color: var(--ok-fg);' : 'background: var(--bg-subtle); color: var(--text-2);',
      boolText: v ? '예' : '아니오',
      stars,
    };
  }
}
</script>
</body>
</html>

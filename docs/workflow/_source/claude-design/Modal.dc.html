<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="ds-icons.js"></script>
<style>
  :root {
    --bg-surface: oklch(1 0 0); --bg-subtle: oklch(0.966 0.003 265); --bg-hover: oklch(0.952 0.004 265);
    --border: oklch(0.918 0.004 265);
    --text-1: oklch(0.245 0.012 265); --text-2: oklch(0.47 0.01 265);
    --accent: oklch(0.52 0.09 264); --accent-hover: oklch(0.46 0.095 264); --accent-fg: oklch(0.99 0 0); --accent-subtle: oklch(0.955 0.022 264); --accent-text: oklch(0.5 0.1 264);
    --danger: oklch(0.57 0.16 25); --danger-bg: oklch(0.96 0.03 25); --danger-fg: oklch(0.51 0.16 25);
    --shadow-lg: 0 16px 48px oklch(0.2 0.02 265 / 0.18);
  }
  html[data-theme="dark"] {
    --bg-surface: oklch(0.205 0.005 265); --bg-subtle: oklch(0.242 0.006 265); --bg-hover: oklch(0.278 0.008 265);
    --border: oklch(0.29 0.007 265);
    --text-1: oklch(0.96 0.003 265); --text-2: oklch(0.72 0.008 265);
    --accent: oklch(0.68 0.11 264); --accent-hover: oklch(0.74 0.11 264); --accent-fg: oklch(0.16 0.02 264); --accent-subtle: oklch(0.3 0.045 264); --accent-text: oklch(0.82 0.09 264);
    --danger: oklch(0.66 0.17 25); --danger-bg: oklch(0.33 0.07 25); --danger-fg: oklch(0.84 0.13 25);
    --shadow-lg: 0 16px 48px oklch(0 0 0 / 0.6);
  }
  * { box-sizing: border-box; }
  @keyframes mdlDim { from { opacity: 0; } to { opacity: 1; } }
  @keyframes mdlPop { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
</style>
</helmet>
<sc-if value="{{ open }}">
  <div style="position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 20px; font-family: 'IBM Plex Sans KR', sans-serif;">
    <div onClick="{{ onClose }}" style="position: absolute; inset: 0; background: oklch(0.15 0.02 265 / 0.45); animation: mdlDim .2s ease;"></div>
    <div style="position: relative; width: 100%; max-width: {{ maxW }}px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-lg); padding: 26px; animation: mdlPop .2s ease;">
      <sc-if value="{{ showIcon }}"><div style="width: 44px; height: 44px; border-radius: 12px; background: {{ iconBg }}; color: {{ iconFg }}; display: grid; place-items: center; margin-bottom: 16px;"><ds-icon glyph="{{ glyph }}" size="20"></ds-icon></div></sc-if>
      <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 7px;">
        <div style="font-size: 18px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-1);">{{ title }}</div>
        <sc-if value="{{ dismissable }}"><button onClick="{{ onClose }}" style="width: 30px; height: 30px; border-radius: 8px; border: none; background: transparent; color: var(--text-2); cursor: pointer; display: grid; place-items: center; flex-shrink: 0; margin: -4px -4px 0 0;" style-hover="background: var(--bg-subtle);"><ds-icon glyph="x" size="17"></ds-icon></button></sc-if>
      </div>
      <div style="font-size: 14px; color: var(--text-2); line-height: 1.6; margin-bottom: 24px;">{{ body }}</div>
      <div style="display: flex; gap: 10px; justify-content: flex-end;">
        <button onClick="{{ onClose }}" style="height: 42px; padding: 0 18px; border-radius: 9px; border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-1); font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit;" style-hover="background: var(--bg-hover);">{{ cancelLabel }}</button>
        <button onClick="{{ onConfirm }}" style="{{ confirmStyle }}" style-hover="{{ confirmHover }}">{{ confirmLabel }}</button>
      </div>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 480, &quot;height&quot;: 320}, &quot;open&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;tone&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;danger&quot;, &quot;accent&quot;], &quot;default&quot;: &quot;danger&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;glyph&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;trash&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;title&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;선택한 에셋을 삭제할까요?&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;body&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;이 작업은 되돌릴 수 없습니다. 선택한 항목이 워크스페이스에서 영구적으로 제거됩니다.&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;confirmLabel&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;삭제&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;cancelLabel&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;취소&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;dismissable&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const isOpen = p.open !== false && p.open !== 'false';
    const tone = p.tone ?? 'danger';
    const glyph = p.glyph ?? (tone === 'danger' ? 'trash' : 'info');
    const toneMap = {
      danger: { bg: 'var(--danger-bg)', fg: 'var(--danger-fg)', btn: 'var(--danger)', btnFg: '#fff', hover: 'filter: brightness(1.06);' },
      accent: { bg: 'var(--accent-subtle)', fg: 'var(--accent-text)', btn: 'var(--accent)', btnFg: 'var(--accent-fg)', hover: 'background: var(--accent-hover);' },
    };
    const T = toneMap[tone] || toneMap.danger;
    const close = () => { if (p.onClose) p.onClose(); };
    return {
      open: isOpen,
      maxW: Number(p.maxW ?? 420),
      showIcon: p.glyph !== '' && (p.showIcon !== false && p.showIcon !== 'false'),
      glyph, iconBg: T.bg, iconFg: T.fg,
      title: p.title ?? '확인이 필요합니다',
      body: p.body ?? '이 작업을 계속하시겠습니까?',
      dismissable: p.dismissable !== false && p.dismissable !== 'false',
      cancelLabel: p.cancelLabel ?? '취소',
      confirmLabel: p.confirmLabel ?? '삭제',
      confirmStyle: `height: 42px; padding: 0 18px; border-radius: 9px; border: none; background: ${T.btn}; color: ${T.btnFg}; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;`,
      confirmHover: T.hover,
      onClose: close,
      onConfirm: () => { if (p.onConfirm) p.onConfirm(); else close(); },
    };
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="ds-icons.js"></script>
<style>
  :root {
    --bg-surface: oklch(1 0 0); --bg-hover: oklch(0.952 0.004 265);
    --border: oklch(0.918 0.004 265);
    --text-2: oklch(0.47 0.01 265); --text-3: oklch(0.63 0.008 265);
    --accent: oklch(0.52 0.09 264); --accent-subtle: oklch(0.955 0.022 264); --accent-text: oklch(0.5 0.1 264);
  }
  html[data-theme="dark"] {
    --bg-surface: oklch(0.205 0.005 265); --bg-hover: oklch(0.278 0.008 265);
    --border: oklch(0.29 0.007 265);
    --text-2: oklch(0.72 0.008 265); --text-3: oklch(0.55 0.008 265);
    --accent: oklch(0.68 0.11 264); --accent-subtle: oklch(0.3 0.045 264); --accent-text: oklch(0.82 0.09 264);
  }
  * { box-sizing: border-box; }
</style>
</helmet>
<div style="display: inline-flex; align-items: center; gap: 6px; font-family: sans-serif;">
  <button onClick="{{ onPrev }}" style="width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-3); cursor: pointer; display: grid; place-items: center;" style-hover="background: var(--bg-hover);"><ds-icon glyph="chevronLeft" size="16"></ds-icon></button>
  <sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
    <sc-if value="{{ it.isGap }}"><span style="color: var(--text-3); padding: 0 4px;">…</span></sc-if>
    <sc-if value="{{ it.isPage }}"><button onClick="{{ it.onClick }}" style="{{ it.style }}">{{ it.n }}</button></sc-if>
  </sc-for>
  <button onClick="{{ onNext }}" style="width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-2); cursor: pointer; display: grid; place-items: center;" style-hover="background: var(--bg-hover);"><ds-icon glyph="chevronRight" size="16"></ds-icon></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 420, &quot;height&quot;: 56}, &quot;page&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 1, &quot;min&quot;: 1, &quot;max&quot;: 99, &quot;tsType&quot;: &quot;number&quot;}, &quot;total&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 12, &quot;min&quot;: 1, &quot;max&quot;: 99, &quot;tsType&quot;: &quot;number&quot;}}">
class Component extends DCLogic {
  state = { page: null };
  renderVals() {
    const p = this.props;
    const total = Number(p.total ?? 12);
    const cur = (p.page != null && p.onChange) ? Number(p.page) : (this.state.page == null ? Number(p.page ?? 1) : this.state.page);
    const set = (n) => { const c = Math.max(1, Math.min(total, n)); this.setState({ page: c }); if (p.onChange) p.onChange(c); };

    // build compact page list: 1 .. window .. total
    const nums = new Set([1, total, cur, cur - 1, cur + 1]);
    if (cur <= 3) { nums.add(2); nums.add(3); }
    if (cur >= total - 2) { nums.add(total - 1); nums.add(total - 2); }
    const sorted = [...nums].filter(n => n >= 1 && n <= total).sort((a, b) => a - b);

    const items = [];
    let prev = 0;
    sorted.forEach(n => {
      if (n - prev > 1) items.push({ isGap: true });
      const on = n === cur;
      items.push({
        isPage: true, n: String(n),
        style: `min-width: 34px; height: 34px; padding: 0 6px; border-radius: 8px; font-size: 13px; font-family: inherit; cursor: pointer; font-weight: ${on ? 600 : 500}; border: 1px solid ${on ? 'var(--accent)' : 'var(--border)'}; background: ${on ? 'var(--accent-subtle)' : 'var(--bg-surface)'}; color: ${on ? 'var(--accent-text)' : 'var(--text-2)'};`,
        onClick: () => set(n),
      });
      prev = n;
    });

    return { items, onPrev: () => set(cur - 1), onNext: () => set(cur + 1) };
  }
}
</script>
</body>
</html>

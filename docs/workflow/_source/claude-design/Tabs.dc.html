<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-surface: oklch(1 0 0); --bg-subtle: oklch(0.966 0.003 265);
    --border: oklch(0.918 0.004 265);
    --text-1: oklch(0.245 0.012 265); --text-2: oklch(0.47 0.01 265); --text-3: oklch(0.63 0.008 265);
    --accent: oklch(0.52 0.09 264);
    --shadow-sm: 0 1px 2px oklch(0.2 0.02 265 / 0.06);
  }
  html[data-theme="dark"] {
    --bg-surface: oklch(0.205 0.005 265); --bg-subtle: oklch(0.242 0.006 265);
    --border: oklch(0.29 0.007 265);
    --text-1: oklch(0.96 0.003 265); --text-2: oklch(0.72 0.008 265); --text-3: oklch(0.55 0.008 265);
    --accent: oklch(0.68 0.11 264);
    --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.3);
  }
  * { box-sizing: border-box; }
</style>
</helmet>
<div style="font-family: 'IBM Plex Sans KR', sans-serif;">
  <sc-if value="{{ isSegment }}">
    <div style="display: inline-flex; gap: 3px; padding: 3px; border-radius: 10px; background: var(--bg-subtle); border: 1px solid var(--border);">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3"><button onClick="{{ t.onClick }}" style="{{ t.segStyle }}">{{ t.label }}</button></sc-for>
    </div>
  </sc-if>
  <sc-if value="{{ isUnderline }}">
    <div style="display: flex; gap: 4px; border-bottom: 1px solid var(--border);">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3"><button onClick="{{ t.onClick }}" style="{{ t.underStyle }}"><span style="padding: 0 10px;">{{ t.label }}</span></button></sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 360, &quot;height&quot;: 60}, &quot;variant&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;underline&quot;, &quot;segment&quot;], &quot;default&quot;: &quot;underline&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;tabs&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;string[]&quot;}, &quot;active&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  state = { active: null };
  renderVals() {
    const p = this.props;
    const variant = p.variant ?? 'underline';
    const raw = p.tabs || [];
    const tabs0 = raw.map(t => (typeof t === 'string' ? { value: t, label: t } : t));
    const controlled = p.active != null && !!p.onChange;
    const active = controlled ? p.active : (this.state.active == null ? (p.active ?? (tabs0[0] && tabs0[0].value)) : this.state.active);
    return {
      isSegment: variant === 'segment',
      isUnderline: variant !== 'segment',
      tabs: tabs0.map(t => {
        const on = t.value === active;
        return {
          label: t.label,
          segStyle: `height: 32px; padding: 0 16px; border-radius: 7px; border: none; cursor: pointer; font-size: 13px; font-family: inherit; font-weight: ${on ? 600 : 500}; transition: color .13s; background: ${on ? 'var(--bg-surface)' : 'transparent'}; color: ${on ? 'var(--text-1)' : 'var(--text-3)'}; box-shadow: ${on ? 'var(--shadow-sm)' : 'none'};`,
          underStyle: `height: 42px; padding: 0; background: none; border: none; cursor: pointer; font-size: 14px; font-family: inherit; transition: color .13s; border-bottom: 2px solid ${on ? 'var(--accent)' : 'transparent'}; color: ${on ? 'var(--text-1)' : 'var(--text-2)'}; font-weight: ${on ? 600 : 500};`,
          onClick: () => { this.setState({ active: t.value }); if (p.onChange) p.onChange(t.value); },
        };
      }),
    };
  }
}
</script>
</body>
</html>
